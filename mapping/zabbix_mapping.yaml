# Référentiel de correspondance Centreon -> Zabbix
# ------------------------------------------------
# Ce fichier est À ADAPTER à votre parc : les règles sont évaluées dans l'ordre,
# la première qui correspond l'emporte. Toutes les expressions sont des regex
# Python, insensibles à la casse.
#
# Critères possibles (tous ceux renseignés doivent correspondre) :
#   template : un des templates de la chaîne d'héritage (service ou hôte)
#   command  : nom de la commande Centreon
#   plugin   : option --plugin=... des Centreon Plugins (ex. os::linux::snmp::plugin)
#   mode     : option --mode=...  des Centreon Plugins (ex. cpu, storage)
#   line     : ligne de commande résolue (utile pour les plugins Nagios check_*)
#
# Champs produits :
#   zabbix_template : template Zabbix officiel couvrant le besoin (vide si aucun)
#   zabbix_item     : clé d'item / mécanisme Zabbix équivalent
#   category        : famille fonctionnelle (pour les filtres et la synthèse)
#   strategy        : Natif | Adapter | Développer | Abandonner
#                     Natif      = couvert par un template officiel Zabbix
#                     Adapter    = équivalent Zabbix existant, à paramétrer
#                     Développer = pas d'équivalent : script externe / UserParameter / agent2 plugin
#                     Abandonner = sans objet sous Zabbix (ex. dummy, passif Centreon)
#   confidence      : Élevée | Moyenne | Faible
#   note            : commentaire libre affiché dans la matrice

host_templates:
  - {template: 'OS-Linux-SNMP',            zabbix_template: 'Linux by SNMP',                         strategy: Natif,   confidence: Élevée}
  - {template: 'OS-Linux-(NRPE|SSH|Local)', zabbix_template: 'Linux by Zabbix agent',                strategy: Natif,   confidence: Élevée, note: 'Remplacer NRPE/SSH par l''agent Zabbix'}
