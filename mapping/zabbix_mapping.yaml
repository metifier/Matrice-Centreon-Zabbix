  - {template: 'generic-active-host|generic-host', zabbix_template: 'ICMP Ping',                   strategy: Natif,   confidence: Moyenne, note: 'Template de base : disponibilité ICMP'}
  - {template: 'App-',                     zabbix_template: '',                                      strategy: Développer, confidence: Faible}

services:
  # --- Ping / disponibilité --------------------------------------------------------
  - {mode: '^(ping|icmp)$',                      category: Disponibilité, zabbix_template: 'ICMP Ping', zabbix_item: 'icmpping / icmppingloss / icmppingsec', strategy: Natif, confidence: Élevée}
  - {template: 'ping|icmp|host-alive',           category: Disponibilité, zabbix_template: 'ICMP Ping', zabbix_item: 'icmpping / icmppingloss / icmppingsec', strategy: Natif, confidence: Élevée}
  - {line: 'check_(ping|icmp|fping)',            category: Disponibilité, zabbix_template: 'ICMP Ping', zabbix_item: 'icmpping / icmppingloss / icmppingsec', strategy: Natif, confidence: Élevée}

  # --- Linux ------------------------------------------------------------------------
  - {plugin: 'os::linux::snmp', mode: '^cpu(-detailed)?$', category: CPU,      zabbix_template: 'Linux by SNMP', zabbix_item: 'system.cpu.util[...] (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::linux::snmp', mode: '^load$',            category: CPU,      zabbix_template: 'Linux by SNMP', zabbix_item: 'system.cpu.load[...] (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::linux::snmp', mode: '^memory$',          category: Mémoire,  zabbix_template: 'Linux by SNMP', zabbix_item: 'vm.memory.* (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::linux::snmp', mode: '^swap$',            category: Mémoire,  zabbix_template: 'Linux by SNMP', zabbix_item: 'system.swap.* (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::linux::snmp', mode: '^(storage|disk-usage|inodes)$', category: Disque, zabbix_template: 'Linux by SNMP', zabbix_item: 'LLD vfs.fs (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::linux::snmp', mode: '^(interfaces|traffic)$', category: Réseau, zabbix_template: 'Linux by SNMP', zabbix_item: 'LLD net.if (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::linux::snmp', mode: '^uptime$',          category: Système,  zabbix_template: 'Linux by SNMP', zabbix_item: 'system.uptime (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::linux::snmp', mode: '^processcount$',    category: Processus, zabbix_template: '', zabbix_item: 'Item SNMP hrSWRunName (à créer)', strategy: Adapter, confidence: Moyenne}
  - {plugin: 'os::linux::(local|ssh)', mode: '^(cpu|load)', category: CPU,     zabbix_template: 'Linux by Zabbix agent', zabbix_item: 'system.cpu.util / system.cpu.load', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::linux::(local|ssh)', mode: '^(memory|swap)$', category: Mémoire, zabbix_template: 'Linux by Zabbix agent', zabbix_item: 'vm.memory.size / system.swap.size', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::linux::(local|ssh)', mode: '^(storage|disk|inodes)', category: Disque, zabbix_template: 'Linux by Zabbix agent', zabbix_item: 'LLD vfs.fs.*', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::linux::(local|ssh)', mode: '^(process|systemd)', category: Processus, zabbix_template: '', zabbix_item: 'proc.num[] / systemd.unit.info[] (agent 2)', strategy: Adapter, confidence: Élevée}
  - {plugin: 'os::linux::(local|ssh)', mode: '^ntp$',     category: Temps,   zabbix_template: '', zabbix_item: 'Item agent : system.localtime / net.udp.service[ntp]', strategy: Adapter, confidence: Moyenne}

  # --- Windows ----------------------------------------------------------------------
  - {plugin: 'os::windows::snmp', mode: '^cpu$',           category: CPU,     zabbix_template: 'Windows by SNMP', zabbix_item: 'system.cpu.util (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::windows::snmp', mode: '^(memory|swap)$', category: Mémoire, zabbix_template: 'Windows by SNMP', zabbix_item: 'vm.memory.* (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::windows::snmp', mode: '^storage$',       category: Disque,  zabbix_template: 'Windows by SNMP', zabbix_item: 'LLD vfs.fs (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: 'os::windows::snmp', mode: '^(service|services)$', category: Services Windows, zabbix_template: 'Windows by Zabbix agent', zabbix_item: 'service.info[] (agent)', strategy: Adapter, confidence: Moyenne, note: 'Passer par l''agent pour les services'}
  - {template: 'OS-Windows.*(Cpu|Processor)',    category: CPU,     zabbix_template: 'Windows by Zabbix agent', zabbix_item: 'system.cpu.util', strategy: Natif, confidence: Élevée}
  - {template: 'OS-Windows.*(Memory|Swap|Page)', category: Mémoire, zabbix_template: 'Windows by Zabbix agent', zabbix_item: 'vm.memory.util / perf_counter', strategy: Natif, confidence: Élevée}
  - {template: 'OS-Windows.*(Disk|Storage|Drive)', category: Disque, zabbix_template: 'Windows by Zabbix agent', zabbix_item: 'LLD vfs.fs.*', strategy: Natif, confidence: Élevée}
  - {template: 'OS-Windows.*Service',            category: Services Windows, zabbix_template: 'Windows by Zabbix agent', zabbix_item: 'LLD service.discovery / service.info[]', strategy: Natif, confidence: Élevée}
  - {template: 'OS-Windows.*(Eventlog|Event-Log)', category: Logs,  zabbix_template: '', zabbix_item: 'eventlog[] (agent actif)', strategy: Adapter, confidence: Élevée}
  - {template: 'OS-Windows.*(Uptime)',           category: Système, zabbix_template: 'Windows by Zabbix agent', zabbix_item: 'system.uptime', strategy: Natif, confidence: Élevée}
  - {line: 'check_nt|nsclient|check_nrpe.*(CheckCPU|checkcpu)', category: CPU, zabbix_template: 'Windows by Zabbix agent', zabbix_item: 'system.cpu.util', strategy: Natif, confidence: Moyenne}

  # --- Réseau -----------------------------------------------------------------------
  - {plugin: '^network::', mode: '^(interfaces|traffic)$', category: Réseau,   zabbix_template: '(template constructeur SNMP)', zabbix_item: 'LLD net.if (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: '^network::', mode: '^(cpu|memory)$',         category: Matériel, zabbix_template: '(template constructeur SNMP)', zabbix_item: 'CPU / mémoire (SNMP)', strategy: Natif, confidence: Élevée}
  - {plugin: '^network::', mode: '^(environment|hardware)$', category: Matériel, zabbix_template: '(template constructeur SNMP)', zabbix_item: 'LLD capteurs / ventilateurs / alimentations', strategy: Natif, confidence: Moyenne}
  - {plugin: '^network::', mode: '^(vpn|ipsec|bgp|ospf|hsrp|vrrp)', category: Réseau, zabbix_template: '', zabbix_item: 'Items SNMP spécifiques (MIB constructeur)', strategy: Adapter, confidence: Faible}
  - {plugin: '^network::',                                  category: Réseau,  zabbix_template: '(template constructeur SNMP)', zabbix_item: 'À vérifier dans le template constructeur', strategy: Adapter, confidence: Faible}

  # --- Matériel ---------------------------------------------------------------------
  - {plugin: '^hardware::server::dell::idrac', category: Matériel, zabbix_template: 'Dell iDRAC by SNMP', zabbix_item: 'LLD capteurs / disques / alimentations', strategy: Natif, confidence: Élevée}
  - {plugin: '^hardware::server::hp::ilo',     category: Matériel, zabbix_template: 'HPE iLO by HTTP',    zabbix_item: 'Redfish', strategy: Natif, confidence: Moyenne}
  - {plugin: '^hardware::ups',                 category: Énergie,  zabbix_template: 'APC UPS by SNMP',    zabbix_item: 'Batterie / charge / autonomie', strategy: Natif, confidence: Moyenne}
  - {plugin: '^hardware::',                    category: Matériel, zabbix_template: '',                   zabbix_item: 'Items SNMP / Redfish (à créer)', strategy: Adapter, confidence: Faible}

  # --- Bases de données -------------------------------------------------------------
  - {plugin: 'database::mysql',    category: Base de données, zabbix_template: 'MySQL by Zabbix agent 2',      zabbix_item: 'mysql.*', strategy: Natif, confidence: Élevée}
  - {plugin: 'database::postgres', category: Base de données, zabbix_template: 'PostgreSQL by Zabbix agent 2', zabbix_item: 'pgsql.*', strategy: Natif, confidence: Élevée}
  - {plugin: 'database::mssql',    category: Base de données, zabbix_template: 'MSSQL by Zabbix agent 2',      zabbix_item: 'mssql.*', strategy: Natif, confidence: Élevée}
  - {plugin: 'database::oracle',   category: Base de données, zabbix_template: 'Oracle by Zabbix Agent 2',     zabbix_item: 'oracle.*', strategy: Natif, confidence: Élevée}
  - {plugin: 'database::(mongodb|redis|elasticsearch)', category: Base de données, zabbix_template: '(template agent 2 dédié)', zabbix_item: '', strategy: Natif, confidence: Moyenne}
  - {mode: 'sql(-string)?$',       category: Base de données, zabbix_template: '', zabbix_item: 'Item ODBC db.odbc.select[] / agent2', strategy: Adapter, confidence: Moyenne, note: 'Requête SQL personnalisée à reprendre'}

  # --- Applications / protocoles ----------------------------------------------------
  - {plugin: 'apps::apache',  category: Web, zabbix_template: 'Apache by HTTP', zabbix_item: 'apache.*', strategy: Natif, confidence: Élevée}
  - {plugin: 'apps::nginx',   category: Web, zabbix_template: 'Nginx by HTTP',  zabbix_item: 'nginx.*',  strategy: Natif, confidence: Élevée}
  - {plugin: 'apps::tomcat',  category: Web, zabbix_template: 'Apache Tomcat by JMX', zabbix_item: 'jmx[]', strategy: Natif, confidence: Élevée}
  - {plugin: 'apps::vmware',  category: Virtualisation, zabbix_template: 'VMware', zabbix_item: 'vmware.*', strategy: Natif, confidence: Élevée}
  - {plugin: 'apps::protocols::http', mode: 'expected-content|response', category: Web, zabbix_template: 'Website by Browser', zabbix_item: 'Scénario Web / web.page.get[] / item HTTP agent', strategy: Adapter, confidence: Élevée}
  - {plugin: 'apps::protocols::(x509|tls)|certificate', category: Certificat, zabbix_template: 'Website certificate by Zabbix agent 2', zabbix_item: 'web.certificate.get[]', strategy: Natif, confidence: Élevée}
  - {plugin: 'apps::protocols::dns', category: DNS,     zabbix_template: '', zabbix_item: 'net.dns[] / net.dns.record[]', strategy: Adapter, confidence: Élevée}
  - {plugin: 'apps::protocols::(smtp|imap|pop)', category: Messagerie, zabbix_template: '', zabbix_item: 'net.tcp.service[smtp|imap|pop]', strategy: Adapter, confidence: Élevée}
  - {plugin: 'apps::protocols::(tcp|udp)', category: Réseau, zabbix_template: '', zabbix_item: 'net.tcp.service[] / net.tcp.port[]', strategy: Adapter, confidence: Élevée}
  - {plugin: 'apps::protocols::(ftp|ssh|ldap|ntp|radius|snmp)', category: Protocole, zabbix_template: '', zabbix_item: 'net.tcp.service[...] / simple check', strategy: Adapter, confidence: Moyenne}
  - {line: 'check_https?\b',        category: Web,        zabbix_template: 'Website by Browser', zabbix_item: 'Scénario Web / item HTTP agent', strategy: Adapter, confidence: Élevée}
  - {line: 'check_ssl_cert|check_cert', category: Certificat, zabbix_template: 'Website certificate by Zabbix agent 2', zabbix_item: 'web.certificate.get[]', strategy: Natif, confidence: Élevée}
  - {line: 'check_dns|check_dig',   category: DNS,        zabbix_template: '', zabbix_item: 'net.dns[]', strategy: Adapter, confidence: Élevée}
  - {line: 'check_(tcp|udp)\b',     category: Réseau,     zabbix_template: '', zabbix_item: 'net.tcp.service[] (simple check)', strategy: Adapter, confidence: Élevée}
  - {line: 'check_(smtp|imap|pop|ftp|ssh|ldap|ntp)', category: Protocole, zabbix_template: '', zabbix_item: 'net.tcp.service[...] (simple check)', strategy: Adapter, confidence: Élevée}
  - {line: 'check_(disk|load|swap|users|procs|mem)', category: Système, zabbix_template: 'Linux by Zabbix agent', zabbix_item: 'vfs.fs / system.cpu.load / proc.num', strategy: Natif, confidence: Moyenne}
  - {line: 'check_log|logfiles',    category: Logs,       zabbix_template: '', zabbix_item: 'log[] / logrt[] (agent actif)', strategy: Adapter, confidence: Moyenne}

  # --- Génériques (par nom de mode / template) --------------------------------------
  - {mode: '^cpu',                        category: CPU,       zabbix_template: '', zabbix_item: 'system.cpu.util', strategy: Adapter, confidence: Moyenne}
  - {mode: '^(memory|swap)',              category: Mémoire,   zabbix_template: '', zabbix_item: 'vm.memory.size', strategy: Adapter, confidence: Moyenne}
  - {mode: '^(storage|disk|inodes|filesystem)', category: Disque, zabbix_template: '', zabbix_item: 'vfs.fs.*', strategy: Adapter, confidence: Moyenne}
  - {mode: '^(interfaces|traffic)',       category: Réseau,    zabbix_template: '', zabbix_item: 'LLD net.if', strategy: Adapter, confidence: Moyenne}
  - {mode: '^uptime',                     category: Système,   zabbix_template: '', zabbix_item: 'system.uptime', strategy: Adapter, confidence: Moyenne}
  - {template: '(^|[-_ ])cpu',            category: CPU,       zabbix_template: '', zabbix_item: 'system.cpu.util', strategy: Adapter, confidence: Faible}
  - {template: '(^|[-_ ])(memory|mem|swap)', category: Mémoire, zabbix_template: '', zabbix_item: 'vm.memory.size', strategy: Adapter, confidence: Faible}
  - {template: '(^|[-_ ])(disk|storage|fs|partition)', category: Disque, zabbix_template: '', zabbix_item: 'vfs.fs.*', strategy: Adapter, confidence: Faible}
  - {template: '(^|[-_ ])(traffic|interface|if)', category: Réseau, zabbix_template: '', zabbix_item: 'LLD net.if', strategy: Adapter, confidence: Faible}
  - {template: '(^|[-_ ])(proc|process)', category: Processus, zabbix_template: '', zabbix_item: 'proc.num[]', strategy: Adapter, confidence: Faible}
  - {template: '(^|[-_ ])ntp',            category: Temps,     zabbix_template: '', zabbix_item: 'net.udp.service[ntp]', strategy: Adapter, confidence: Faible}

  # --- Sans objet sous Zabbix -------------------------------------------------------
  - {command: 'dummy|check_centreon_dummy|passive', category: Passif / Dummy, zabbix_template: '', zabbix_item: 'Item trapper (zabbix_sender) si encore utile', strategy: Abandonner, confidence: Moyenne}
  - {template: '^(Meta|meta_)|^Module-Meta', category: Méta-service, zabbix_template: '', zabbix_item: 'Item calculé / agrégé', strategy: Adapter, confidence: Moyenne}
