  - {template: 'App-DB-MSSQL',             zabbix_template: 'MSSQL by Zabbix agent 2',               strategy: Natif,   confidence: Élevée}
  - {template: 'App-DB-Oracle',            zabbix_template: 'Oracle by Zabbix Agent 2',              strategy: Natif,   confidence: Élevée}
  - {template: 'App-DB-MongoDB',           zabbix_template: 'MongoDB node by Zabbix agent 2',        strategy: Natif,   confidence: Élevée}
  - {template: 'App-DB-Redis',             zabbix_template: 'Redis by Zabbix agent 2',               strategy: Natif,   confidence: Élevée}
  - {template: 'App-DB-Elasticsearch',     zabbix_template: 'Elasticsearch Cluster by HTTP',         strategy: Natif,   confidence: Élevée}
  - {template: 'App-Webserver-Apache',     zabbix_template: 'Apache by HTTP',                        strategy: Natif,   confidence: Élevée}
  - {template: 'App-Webserver-Nginx',      zabbix_template: 'Nginx by HTTP',                         strategy: Natif,   confidence: Élevée}
  - {template: 'App-Webserver-IIS',        zabbix_template: 'Microsoft IIS by Zabbix agent',         strategy: Natif,   confidence: Élevée}
  - {template: 'App-Tomcat',               zabbix_template: 'Apache Tomcat by JMX',                  strategy: Natif,   confidence: Élevée}
  - {template: 'App-Jvm|App-Java',         zabbix_template: 'Generic Java JMX',                      strategy: Natif,   confidence: Moyenne}
  - {template: 'App-RabbitMQ',             zabbix_template: 'RabbitMQ node by HTTP',                 strategy: Natif,   confidence: Élevée}
  - {template: 'App-Kafka',                zabbix_template: 'Apache Kafka by JMX',                   strategy: Natif,   confidence: Moyenne}
  - {template: 'App-Docker',               zabbix_template: 'Docker by Zabbix agent 2',              strategy: Natif,   confidence: Élevée}
  - {template: 'Cloud-Kubernetes|App-Kubernetes', zabbix_template: 'Kubernetes cluster state by HTTP', strategy: Natif, confidence: Moyenne}
  - {template: 'App-Exchange',             zabbix_template: 'Microsoft Exchange Server 2016 by Zabbix agent', strategy: Natif, confidence: Moyenne}
  - {template: 'App-ActiveDirectory|App-AD-', zabbix_template: 'Active Directory DS by Zabbix agent', strategy: Natif,  confidence: Moyenne}
  - {template: 'App-Haproxy',              zabbix_template: 'HAProxy by HTTP',                       strategy: Natif,   confidence: Élevée}
  - {template: 'App-Squid',                zabbix_template: 'Squid by SNMP',                         strategy: Natif,   confidence: Moyenne}
  - {template: 'App-Php-Fpm',              zabbix_template: 'PHP-FPM by HTTP',                       strategy: Natif,   confidence: Élevée}
  - {template: 'App-Memcached',            zabbix_template: 'Memcached by Zabbix agent 2',           strategy: Natif,   confidence: Élevée}
  - {template: 'App-Protocol-Dns|App-DNS', zabbix_template: '',  zabbix_item: 'net.dns[]',           strategy: Adapter, confidence: Moyenne}
  - {template: 'App-Protocol-Http|App-Protocol-Https', zabbix_template: 'Website by Browser',        strategy: Adapter, confidence: Moyenne, note: 'Ou scénario Web Zabbix'}
